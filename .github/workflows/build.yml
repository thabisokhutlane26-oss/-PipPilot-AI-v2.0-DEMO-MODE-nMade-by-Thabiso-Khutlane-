package com.apexpipai.app

import android.os.Bundle
import android.widget.Button
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {

    private lateinit var marketStatus: TextView
    private lateinit var prediction: TextView
    private lateinit var confidence: TextView
    private lateinit var signal: TextView
    private lateinit var predictButton: Button

    override fun onCreate(savedInstanceState: Bundle?) {

        super.onCreate(savedInstanceState)

        setContentView(R.layout.activity_main)

        marketStatus = findViewById(R.id.marketStatus)

        prediction = findViewById(R.id.prediction)

        confidence = findViewById(R.id.confidence)

        signal = findViewById(R.id.signal)

        predictButton = findViewById(R.id.predictButton)

        predictButton.setOnClickListener {

            runPrediction()

        }
    }

    private fun runPrediction() {

        marketStatus.text =
            "Market Status: Analysis Complete"

        prediction.text =
            "UP"

        confidence.text =
            "Confidence: 78%"

        signal.text =
            "Signal: Potential UP movement"

        predictButton.text =
            "ANALYZE AGAIN"
    }
}


