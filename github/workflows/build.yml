name: Build ApexPipAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ARTIFACT_BASENAME: ApexPipAI-debug
  ARTIFACT_FILE: ${{ env.ARTIFACT_BASENAME }}-${{ github.run_number }}-${{ github.sha.substring(0,7) }}.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        shell: bash
        run: |
          echo "Searching for Android project ZIP..."
          ZIP_FILE=$(find . \
            -maxdepth 4 \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          echo "Extracting Android project..."
          rm -rf android_project
          mkdir -p android_project
          unzip -q -o "$ZIP_FILE" -d android_project
          echo ""
          echo "Extracted files (sample):"
          find android_project -maxdepth 8 -type f \
            -not -path "*/.gradle/*" \
            | sort | head -500

      - name: Locate Gradle project
        shell: bash
        run: |
          echo "Searching for settings.gradle..."
          SETTINGS_FILE=$(find android_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Gradle project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*','**/settings.gradle*','**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Ensure Gradle wrapper (only if missing)
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          if [ -x "${PWD}/gradlew" ]; then
            echo "gradlew already exists in project; will use it."
          else
            echo "No gradlew found; generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.10 --distribution-type bin
            chmod +x gradlew
            echo "Gradle wrapper generated."
          fi

      - name: Find MainActivity.kt
        shell: bash
        run: |
          echo "Searching for MainActivity.kt..."
          MAIN_ACTIVITY=$(find "$PROJECT_DIR" \
            -type f \
            -name "MainActivity.kt" \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt was not found."
            echo ""
            echo "Kotlin files found (sample):"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.kt" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" \
              | sort | head -200
          else
            echo "MainActivity.kt found: $MAIN_ACTIVITY"
          fi

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --version

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."
          # match common debug APK patterns and pick first result
          APK=$(find "$PROJECT_DIR" -type f \( -name "*-debug.apk" -o -name "*.apk" \) -not -path "*/.gradle/*" | grep -i debug | head -n 1 || true)
          if [ -z "$APK" ]; then
            # fallback: any apk
            APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -not -path "*/.gradle/*" | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK SUCCESSFULLY GENERATED"
          echo "======================================"
          echo "$APK"

          mkdir -p artifacts
          cp "$APK" "artifacts/${ARTIFACT_FILE}"
          echo "ARTIFACT_PATH=artifacts/${ARTIFACT_FILE}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_FILE }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
