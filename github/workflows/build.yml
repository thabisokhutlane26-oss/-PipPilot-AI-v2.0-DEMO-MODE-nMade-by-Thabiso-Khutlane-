name: Build PipPilot AI v3.0 (safer)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ARTIFACT_BASENAME: PipPilotAI-debug
  ARTIFACT_FILE: ${{ env.ARTIFACT_BASENAME }}-${{ github.run_number }}-${{ github.sha.substring(0,7) }}.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        shell: bash
        run: |
          echo "Looking for PipPilotAI_Android_Project.zip..."
          ZIP=$(find . -maxdepth 3 -type f -name "PipPilotAI_Android_Project.zip" -not -path "./.git/*" | head -n1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found. Place PipPilotAI_Android_Project.zip in the repo root or adjust the path."
            exit 1
          fi
          echo "ZIP found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract app
        shell: bash
        run: |
          rm -rf app_project
          mkdir -p app_project
          unzip -q -o "$ZIP" -d app_project
          echo "Sample files in app_project:"
          find app_project -maxdepth 4 -type f | sed -n '1,20p'

      - name: Locate Gradle wrapper
        shell: bash
        run: |
          GRADLEW=$(find app_project -type f -name gradlew | head -n1 || true)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found. Please include the Gradle wrapper in the project."
            exit 1
          fi
          GRADLEW_DIR=$(dirname "$GRADLEW")
          echo "Gradle wrapper directory: $GRADLEW_DIR"
          echo "GRADLEW_DIR=$GRADLEW_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          # Search common debug APK locations under the project directory
          APK=$(find . -type f \( -iname "*-debug.apk" -o -iname "*.apk" \) -not -path "*/.gradle/*" | grep -i debug | head -n1 || true)
          if [ -z "$APK" ]; then
            APK=$(find . -type f -iname "*.apk" -not -path "*/.gradle/*" | head -n1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi
          echo "APK found: $APK"
          mkdir -p artifacts
          cp "$APK" "artifacts/${ARTIFACT_FILE}"
          echo "ARTIFACT_PATH=artifacts/${ARTIFACT_FILE}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_FILE }}
          path: ${{ env.ARTIFACT_PATH }}
